[project]
name = "synadia-durable"
version = "0.7.0a0"
description = "The thin durable execution SDK: the replay core of synadia-durable in your process, durable-engine behind it."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Synadia Communications" }]
requires-python = ">=3.11"
dependencies = ["nats-py>=2.15.0"]
keywords = ["nats", "durable", "workflow", "durable-execution"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Distributed Computing",
]

[project.optional-dependencies]
# The core library has no crypto dependency. `aes_gcm_payload_codec` — the ready-made
# PayloadCodec for encryption at rest — needs one, so it is an opt-in extra.
crypto = ["cryptography>=42"]

[project.urls]
Homepage = "https://github.com/synadia-ai/durable-sdk"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synadia_durable"]
# PEP 561: ship the marker, or every downstream type checker silently ignores our annotations.
artifacts = ["src/synadia_durable/py.typed"]

[dependency-groups]
dev = [
  "cryptography>=42",
  "mypy>=1.13",
  # nats-py reads a creds file only with nkeys installed: the harness's existing-server mode
  # (`DE_NATS_CREDS`, tests/existing.py) and the interop worker it spawns need it.
  "nkeys>=0.2",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  # Coverage is a dev dependency, not a gate step: `uv run pytest --cov` on demand. Keeping it out
  # of `addopts` keeps the gate fast, and keeping it installed keeps the baseline one command away.
  "pytest-cov>=6",
  "ruff>=0.8",
]

[tool.ruff]
line-length = 100
# `examples` is a source root too, so isort groups an example's own helper module (scale_shared)
# with the library rather than filing it under third-party.
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PT", "ARG", "C4", "TID", "BLE"]
ignore = [
  # The formatter owns line length; E501 would only ever fire on strings/comments it cannot split.
  "E501",
  # Prose in this project uses typographic punctuation on purpose — em dashes, §, ·, → — matching
  # the docs and the TypeScript sources these modules mirror. RUF001-003 flag every one of them.
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# The error names are the PROTOCOL's vocabulary (§12) and match the TypeScript twin one for one.
# Renaming WorkflowFailure to WorkflowFailureError to satisfy a suffix convention would put the two
# SDKs' public surfaces out of step for nothing.
"src/synadia_durable/errors.py" = ["N818"]
# Wire field names are JSON keys, not Python identifiers: `wfVersion`, `resolvesSeq`, `childRunId`
# are what goes on the stream, so N815 (mixedCase in class scope) is exactly wrong here.
"src/synadia_durable/journal/entry.py" = ["N815"]
# InvariantViolation mirrors the TypeScript twin's name and means "a bug in this library".
"src/synadia_durable/_internal/invariant.py" = ["N818"]

# The library's shell, copied for the suites' own staging with its imports re-pointed
# (`synadia_durable._nats.` → `shell.`); exempt from sorting so that, when it was copied, its diff
# against the library at 7456c75 was those lines alone (history: the library is retired).
"tests/shell/*.py" = ["I001"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
# Examples are checked too: they are the first CONSUMER of this package, and the only place the
# public surface is used the way a user would use it. That is how the missing py.typed marker was
# found — the library was fully typed and shipped none of it.
files = ["src", "tests", "examples", "conformance"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

# `uv run pytest --cov` — the baseline in one command. Deliberately NOT in addopts: the gate runs on
# every increment and coverage instrumentation is pure overhead there.
[tool.coverage.run]
source = ["synadia_durable"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
